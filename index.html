<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Startpage | ChromeOS Style</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #F4F6F4;
      --card-bg: #FFFFFF;
      --card-hover: #F8FAF8;
      
      --terracotta: #D96B43;
      --terracotta-light: #FDF0EC;
      --terracotta-hover: #C55A33;
      
      --sage: #7A9A8B;
      --sage-light: #EBF2EE;
      --sage-dark: #2C4035;
      
      --text-main: #222B27;
      --text-muted: #6B7B73;
      --border-color: #E2E8E4;
      
      --shadow-sm: 0 2px 8px rgba(44, 64, 53, 0.04);
      --shadow-md: 0 8px 24px rgba(44, 64, 53, 0.08);
      --radius-pill: 999px;
      --radius-card: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1.5rem;
      transition: background-color 0.3s ease;
    }

    .header-container {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }

    .time-badge {
      background-color: var(--sage-light);
      color: var(--sage-dark);
      padding: 0.6rem 1.2rem;
      border-radius: var(--radius-pill);
      font-weight: 600;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-edit {
      background-color: var(--terracotta-light);
      color: var(--terracotta);
      border: 1px solid rgba(217, 107, 67, 0.2);
      padding: 0.6rem 1.2rem;
      border-radius: var(--radius-pill);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-edit:hover {
      background-color: var(--terracotta);
      color: #fff;
    }

    .search-section {
      width: 100%;
      max-width: 700px;
      margin-bottom: 3rem;
    }

    .search-box {
      background: var(--card-bg);
      padding: 0.5rem;
      border-radius: var(--radius-pill);
      box-shadow: var(--shadow-md);
      display: flex;
      align-items: center;
      border: 1px solid var(--border-color);
      transition: all 0.2s ease;
    }

    .search-box:focus-within {
      border-color: var(--terracotta);
      box-shadow: 0 8px 24px rgba(217, 107, 67, 0.15);
    }

    .search-input {
      border: none;
      outline: none;
      background: transparent;
      padding: 0.8rem 1.2rem;
      font-size: 1rem;
      width: 100%;
      color: var(--text-main);
    }

    .search-engines {
      display: flex;
      gap: 0.5rem;
      margin-top: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .engine-btn {
      background: transparent;
      border: none;
      padding: 0.4rem 0.9rem;
      border-radius: var(--radius-pill);
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .engine-btn.active {
      background: var(--sage);
      color: #fff;
    }

    .main-grid {
      width: 100%;
      max-width: 1000px;
      display: flex;
      flex-direction: column;
      gap: 2.5rem;
    }

    .category-section {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .category-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--sage-dark);
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .category-title::before {
      content: '';
      width: 8px;
      height: 18px;
      background-color: var(--terracotta);
      border-radius: 4px;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 1rem;
    }

    .card {
      background: var(--card-bg);
      padding: 1.2rem 1rem;
      border-radius: var(--radius-card);
      text-decoration: none;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.8rem;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-color);
      transition: all 0.2s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
      background: var(--card-hover);
      border-color: var(--sage);
    }

    .card-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--sage-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      color: var(--sage-dark);
      font-weight: 700;
      overflow: hidden;
    }

    .card-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-title {
      font-size: 0.9rem;
      font-weight: 600;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    /* Modal Styling */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.3);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-content {
      background: var(--card-bg);
      padding: 2rem;
      border-radius: var(--radius-card);
      width: 90%;
      max-width: 500px;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: var(--shadow-md);
    }

    .modal-title {
      font-size: 1.3rem;
      color: var(--sage-dark);
      margin-bottom: 1.5rem;
    }

    .form-group {
      margin-bottom: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .form-group label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .form-control {
      padding: 0.7rem 1rem;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      outline: none;
    }

    .btn-group {
      display: flex;
      gap: 0.5rem;
      margin-top: 1.5rem;
    }

    .btn {
      padding: 0.6rem 1.2rem;
      border-radius: var(--radius-pill);
      border: none;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-primary { background: var(--terracotta); color: #fff; }
    .btn-secondary { background: var(--sage-light); color: var(--sage-dark); }
  </style>
</head>
<body>

  <div class="header-container">
    <div class="time-badge" id="clock">00:00</div>
    <button class="btn-edit" onclick="toggleModal()">⚙️ Configurar</button>
  </div>

  <div class="search-section">
    <form id="searchForm" action="https://www.google.com/search" method="get">
      <div class="search-box">
        <input type="text" name="q" class="search-input" placeholder="Pesquisar na web..." required autofocus>
      </div>
    </form>
    <div class="search-engines">
      <button class="engine-btn active" onclick="setEngine('google', this)">Google</button>
      <button class="engine-btn" onclick="setEngine('ddg', this)">DuckDuckGo</button>
      <button class="engine-btn" onclick="setEngine('youtube', this)">YouTube</button>
      <button class="engine-btn" onclick="setEngine('github', this)">GitHub</button>
    </div>
  </div>

  <div class="main-grid" id="mainGrid"></div>

  <!-- Modal de edição -->
  <div class="modal" id="modal">
    <div class="modal-content">
      <h3 class="modal-title">Adicionar / Gerenciar Links</h3>
      <div class="form-group">
        <label>Categoria</label>
        <input type="text" id="catInput" class="form-control" placeholder="Ex: Compras, Dev, Redes">
      </div>
      <div class="form-group">
        <label>Nome do Site</label>
        <input type="text" id="titleInput" class="form-control" placeholder="Ex: Mercado Livre">
      </div>
      <div class="form-group">
        <label>URL</label>
        <input type="url" id="urlInput" class="form-control" placeholder="https://mercadolivre.com.br">
      </div>
      <div class="btn-group">
        <button class="btn btn-primary" onclick="addSite()">Salvar Novo Site</button>
        <button class="btn btn-secondary" onclick="exportJSON()">Exportar JSON</button>
        <button class="btn btn-secondary" onclick="toggleModal()">Fechar</button>
      </div>
    </div>
  </div>

  <script>
    // Dados Padrão
    const defaultData = [
      {
        category: "Compras",
        sites: [
          { name: "Mercado Livre", url: "https://www.mercadolivre.com.br" },
          { name: "Etsy", url: "https://www.etsy.com" },
          { name: "Amazon", url: "https://www.amazon.com.br" }
        ]
      },
      {
        category: "Desenvolvimento",
        sites: [
          { name: "GitHub", url: "https://github.com" },
          { name: "Stack Overflow", url: "https://stackoverflow.com" }
        ]
      }
    ];

    let data = JSON.parse(localStorage.getItem('startpage_data')) || defaultData;

    function render() {
      const grid = document.getElementById('mainGrid');
      grid.innerHTML = '';

      data.forEach(cat => {
        const sec = document.createElement('div');
        sec.className = 'category-section';
        sec.innerHTML = `<div class="category-title">${cat.category}</div>`;

        const cardsGrid = document.createElement('div');
        cardsGrid.className = 'cards-grid';

        cat.sites.forEach(site => {
          const domain = new URL(site.url).hostname;
          const iconUrl = `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;

          cardsGrid.innerHTML += `
            <a href="${site.url}" class="card">
              <div class="card-icon">
                <img src="${iconUrl}" onerror="this.onerror=null; this.parentNode.innerText='${site.name[0]}'">
              </div>
              <div class="card-title">${site.name}</div>
            </a>
          `;
        });

        sec.appendChild(cardsGrid);
        grid.appendChild(sec);
      });
    }

    function setEngine(engine, btn) {
      document.querySelectorAll('.engine-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const form = document.getElementById('searchForm');
      
      if(engine === 'google') form.action = 'https://www.google.com/search';
      if(engine === 'ddg') form.action = 'https://duckduckgo.com/';
      if(engine === 'youtube') form.action = 'https://www.youtube.com/results';
      if(engine === 'github') form.action = 'https://github.com/search';
    }

    function updateClock() {
      const now = new Date();
      document.getElementById('clock').innerText = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    }

    function toggleModal() {
      const modal = document.getElementById('modal');
      modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
    }

    function addSite() {
      const cat = document.getElementById('catInput').value.trim();
      const title = document.getElementById('titleInput').value.trim();
      const url = document.getElementById('urlInput').value.trim();

      if(!cat || !title || !url) return alert('Preencha todos os campos!');

      let targetCat = data.find(c => c.category.toLowerCase() === cat.toLowerCase());
      if(!targetCat) {
        targetCat = { category: cat, sites: [] };
        data.push(targetCat);
      }

      targetCat.sites.push({ name: title, url: url });
      localStorage.setItem('startpage_data', JSON.stringify(data));
      
      render();
      toggleModal();
      document.getElementById('catInput').value = '';
      document.getElementById('titleInput').value = '';
      document.getElementById('urlInput').value = '';
    }

    function exportJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "config.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    setInterval(updateClock, 1000);
    updateClock();
    render();
  </script>
</body>
</html>
